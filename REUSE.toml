version = 1

# First-party BreachSAFE material is open source under Apache-2.0
# Noncommercial. Source files carry inline headers; these annotations cover
# formats where a header is unsuitable or would be regenerated away.

[[annotations]]
path = [
    "README.md",
    "[Cc][Ll][Aa][Uu][Dd][Ee].md",
    "AGENTS.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    "NOTICE",
    "REUSE.toml",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    ".lycheeignore",
    ".markdownlint-cli2.jsonc",
    "justfile",
    "uv.lock",
    "scripts/release-tools.json",
]
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".github/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".[Cc][Ll][Aa][Uu][Dd][Ee]/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".agents/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/golden/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

# These vendored schemas are upstream CycloneDX material, not BreachSAFE code.
[[annotations]]
path = [
    "tests/conformance/*.json",
    "tests/conformance/fixtures/**",
    "tests/conformance/schemas/**/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "CycloneDX contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/conformance/schemas/**/*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "CycloneDX contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "LICENSES/Apache-2.0.txt"
SPDX-FileCopyrightText = "2004 Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

