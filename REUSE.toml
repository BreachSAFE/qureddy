version = 1

# Project-wide REUSE annotations for files that don't carry inline
# SPDX headers. Source files (Python, shell) carry inline
# `# SPDX-FileCopyrightText` and `# SPDX-License-Identifier` headers
# and are not annotated here.
#
# This block exists primarily for:
#   - Markdown / documentation files that look noisy with shebang-style
#     comment headers
#   - GitHub templates that GitHub itself parses (issue / PR templates,
#     CODEOWNERS, dependabot config) where a leading SPDX comment can
#     interfere with rendering
#   - Skill SKILL.md files that quote `SPDX-License-Identifier` inside
#     backticks for documentation; reuse-lint mistakes the quoted form
#     for an actual declaration. The override below tells reuse the
#     skill files are Apache-2.0 regardless of any quoted patterns
#     elsewhere in their body.

[[annotations]]
path = [
    "README.md",
    "[Cc][Ll][Aa][Uu][Dd][Ee].md",
    "AGENTS.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    "REUSE.toml",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    "justfile",
    # uv.lock is machine-generated by `uv lock` and has no comment
    # syntax that survives regeneration. Annotate here instead of
    # adding a sidecar .license file.
    "uv.lock",
    "scripts/release-tools.json",
]
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".github/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".[Cc][Ll][Aa][Uu][Dd][Ee]/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# Copies of the same skills library as .agents/skills/, installed from the
# canonical skills repository. Same reasoning as the private-skills block:
# annotate here so installed copies
# stay byte-identical to the library (its drift_check compares content;
# adding inline headers per-repo would flag every file as drifted).
path = ".agents/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/golden/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "tests/conformance/*.json",
    "tests/conformance/fixtures/**",
    "tests/conformance/schemas/**/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/conformance/schemas/**/*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "CycloneDX contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "LICENSES/**"
# The Apache 2.0 license text itself is a work of the Apache Software
# Foundation, not of BreachSAFE — attributing it correctly here keeps
# REUSE-lint output honest and matches the convention upstream Apache
# projects use.
SPDX-FileCopyrightText = "2004 Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"
