# Shared MAX quality + architecture gates. The contract is versioned in
# breachsafe-common; update the ref only through a reviewed workflow change.

name: Quality Gates (MAX)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    uses: paul007ex/breachsafe-common/.github/workflows/quality-gates-python.yml@v1.1.1
    with:
      module: qureddy
      coverage_min: 90
      container_tag: 3.14-openssl3.5.7
