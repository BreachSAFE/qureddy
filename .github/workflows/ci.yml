# SPDX-License-Identifier: Apache-2.0
#
# QuReddy CI — 7-phase pipeline per docs/contributors/coding-rules.md §21.
#
# Matrix: ubuntu × macos × windows on Python 3.12. OpenSSL 3.5+ installed
# per OS. Every test runs every time. pytest-rerunfailures absorbs
# transient hiccups (3 attempts, 1s delay) globally via pyproject.toml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ===========================================================================
  # Phase 1 — Static analysis (no execution).
  # Lint, format-check, type, static security, dep CVEs, license, secrets.
  # ===========================================================================
  phase-1-static:
    name: "Phase 1: Static (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run --locked ruff check .

      - name: ruff format --check
        run: uv run --locked ruff format --check .

      - name: mypy --strict
        run: uv run --locked mypy src/qureddy --strict

      - name: bandit
        run: uv run --locked bandit -r -ll src/qureddy scripts/

      - name: pip-audit
        run: uv run --locked pip-audit

      - name: deptry
        run: uv run --locked deptry .

      - name: reuse lint
        run: uv run --locked reuse lint

      - name: gitleaks (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Phase 2 — Unit tests (hermetic, no network, no real OpenSSL).
  # Excludes tests/live/.
  # ===========================================================================
  phase-2-unit:
    name: "Phase 2: Unit (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: phase-1-static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: pytest (unit only, with coverage)
        run: |
          uv run --locked pytest --ignore=tests/live \
            --cov=qureddy \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=pytest-results.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            .coverage
            coverage.xml
            pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Phase 3 — Integration tests (real OpenSSL 3.5+ subprocess, no network).
  # OpenSSL is installed per-OS.
  # ===========================================================================
  phase-3-integration:
    name: "Phase 3: Integration (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: phase-2-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install OpenSSL 3.5+ (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ubuntu 24.04 ships OpenSSL 3.0; install 3.5+ from upstream tarball.
          OPENSSL_VERSION="3.5.1"
          OPENSSL_SHA256="529043b15cffa5f36077a4d0af83f3de399807181d607441d734196d889b641f"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum --check --strict
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null
          echo "/opt/openssl-3.5/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl-3.5/lib64:/opt/openssl-3.5/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install OpenSSL 3.5+ (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL 3.5+ (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Chocolatey's versioned package delegates to an upstream installer
          # URL that disappears when Shining Light rotates releases. Install
          # the maintained current package, then verify the capability below.
          choco install openssl --no-progress -y
          $candidates = @(
            (Join-Path $env:ProgramFiles "OpenSSL\bin\openssl.exe"),
            (Join-Path $env:ProgramFiles "OpenSSL-Win64\bin\openssl.exe"),
            (Join-Path $env:ChocolateyInstall "bin\openssl.exe")
          )
          $opensslExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslExe) {
            throw "Chocolatey installed OpenSSL but no openssl.exe was discoverable"
          }
          $opensslBin = Split-Path -Parent $opensslExe
          $opensslBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify OpenSSL version
        run: |
          openssl version
          openssl list -tls1_3 -tls-groups | tee openssl-groups.txt
          grep -qi X25519MLKEM768 openssl-groups.txt

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: pytest tests/test_openssl_probe.py
        run: uv run --locked pytest tests/test_openssl_probe.py -v

  # ===========================================================================
  # Phase 4 — Live tests (network required, real targets).
  # tests/live/ runs with default pytest. pytest-rerunfailures absorbs hiccups.
  # ===========================================================================
  phase-4-live:
    name: "Phase 4: Live (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: phase-3-integration
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install OpenSSL 3.5+ (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          OPENSSL_VERSION="3.5.1"
          OPENSSL_SHA256="529043b15cffa5f36077a4d0af83f3de399807181d607441d734196d889b641f"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum --check --strict
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null
          echo "/opt/openssl-3.5/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl-3.5/lib64:/opt/openssl-3.5/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install OpenSSL 3.5+ (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL 3.5+ (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install openssl --no-progress -y
          $candidates = @(
            (Join-Path $env:ProgramFiles "OpenSSL\bin\openssl.exe"),
            (Join-Path $env:ProgramFiles "OpenSSL-Win64\bin\openssl.exe"),
            (Join-Path $env:ChocolateyInstall "bin\openssl.exe")
          )
          $opensslExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslExe) {
            throw "Chocolatey installed OpenSSL but no openssl.exe was discoverable"
          }
          $opensslBin = Split-Path -Parent $opensslExe
          $opensslBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: Verify OpenSSL capability
        run: |
          openssl version
          openssl list -tls1_3 -tls-groups | tee openssl-groups.txt
          grep -qi X25519MLKEM768 openssl-groups.txt

      - name: pytest tests/live/
        run: uv run --locked pytest tests/live/ -v --junitxml=live-results.xml

      - name: Upload live-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-results-${{ matrix.os }}
          path: live-results.xml
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Phase 5 — Self-scan (qureddy scans qureddy's canonical targets).
  # ===========================================================================
  phase-5-self-scan:
    name: "Phase 5: Self-scan"
    runs-on: ubuntu-latest
    needs: phase-4-live

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install OpenSSL 3.5+
        run: |
          OPENSSL_VERSION="3.5.1"
          OPENSSL_SHA256="529043b15cffa5f36077a4d0af83f3de399807181d607441d734196d889b641f"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum --check --strict
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null
          echo "/opt/openssl-3.5/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl-3.5/lib64:/opt/openssl-3.5/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Scan canonical targets
        run: |
          mkdir -p phase-5-self-scan
          uv run --locked qureddy scan tls www.cloudflare.com --format json > phase-5-self-scan/cloudflare.json
          uv run --locked qureddy scan tls pq.cloudflareresearch.com --format json > phase-5-self-scan/pq-cloudflare.json
          uv run --locked qureddy scan tls www.google.com --format json > phase-5-self-scan/google.json
          uv run --locked qureddy scan tls example.com --format json > phase-5-self-scan/example.json
          uv run --locked qureddy scan tls 1.1.1.1:443 --sni one.one.one.one --format json > phase-5-self-scan/1111.json
          set +e
          uv run --locked qureddy scan tls tls-v1-2.badssl.com:1012 --format json > phase-5-self-scan/tls12.json
          tls12_exit=$?
          set -e
          test "$tls12_exit" -eq 2

      - name: Upload self-scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-self-scan
          path: phase-5-self-scan/
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # Phase 6 — Build verification.
  # ===========================================================================
  phase-6-build:
    name: "Phase 6: Build"
    runs-on: ubuntu-latest
    needs: phase-5-self-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: uv build
        run: |
          uv sync --locked --extra dev
          uv build

      - name: Upload built artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: trivy fs scan
        # v0.36.0, pinned to the dereferenced commit (not a mutable tag).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          skip-dirs: scratch,.git

  # ===========================================================================
  # Phase 7 — Audit. Reads prior phase artifacts. Asserts on counts.
  # The anti-skim guard: passing exit codes from earlier phases are NOT enough.
  # ===========================================================================
  phase-7-audit:
    name: "Phase 7: Audit"
    runs-on: ubuntu-latest
    needs: phase-6-build
    if: always()  # always run even if prior phases failed; audit reports the gaps

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install locked audit dependencies
        run: uv sync --locked --extra dev

      - name: Download all phase artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts/

      - name: List artifacts
        run: ls -laR ci-artifacts/ || echo "no artifacts collected"

      - name: Run audit script
        run: uv run --locked python scripts/audit_phase.py --artifacts-dir ci-artifacts/

  # ===========================================================================
  # Final-byte CBOM conformance — independent, offline schemas + pinned CLI.
  # This gate is intentionally blocking and uses an installed wheel, never the
  # editable source tree, to exercise the public console entrypoint.
  # ===========================================================================
  cbom-conformance:
    name: "CBOM: CycloneDX 1.7 final bytes"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install candidate wheel
        run: |
          python -m pip install "build==1.3.0"
          python -m build --wheel
          python -m venv .conformance-venv
          .conformance-venv/bin/python -m pip install \
            dist/breachsafe_qureddy-*.whl \
            "jsonschema==4.25.1" \
            "rfc3339-validator==0.1.4"

      - name: Fetch pinned independent CycloneDX validator
        run: |
          asset_url="$(python -c 'import json; print(json.load(open("tests/conformance/cyclonedx-cli-v0.33.1.json"))["assets"]["linux-x64"]["url"])')"
          expected_sha="$(python -c 'import json; print(json.load(open("tests/conformance/cyclonedx-cli-v0.33.1.json"))["assets"]["linux-x64"]["sha256"])')"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$asset_url" --output cyclonedx-cli
          echo "$expected_sha  cyclonedx-cli" | sha256sum --check --strict
          chmod +x cyclonedx-cli

      - name: Validate final installed-console bytes
        run: |
          .conformance-venv/bin/python scripts/run_cbom_conformance.py \
            --cyclonedx-cli ./cyclonedx-cli \
            --tool-asset-key linux-x64 \
            --qureddy-console .conformance-venv/bin/qureddy

  # ===========================================================================
  # PyPI artifact proof — build once with pinned tooling, audit runtime-only
  # dependencies, then install the exact wheel/sdist on every supported OS.
  # This is the packaging contract (#33), not the release orchestrator (#34).
  # ===========================================================================
  packaging-build:
    name: "Package: build and runtime audit"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned build tools
        run: python -m pip install "uv==0.11.32" "build==1.3.0" "twine==6.2.0"

      - name: Verify lock and build artifacts
        run: |
          uv lock --check
          python -m build
          twine check dist/*
          cd dist
          sha256sum breachsafe_qureddy-* > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Reject internal archive content
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          forbidden = (".claude", ".agents", "scratch", "AGENTS.md", "CLAUDE.md",
                       "__pycache__", ".pyc")
          for path in Path("dist").iterdir():
              if path.suffix == ".whl":
                  names = zipfile.ZipFile(path).namelist()
              elif path.name.endswith(".tar.gz"):
                  names = tarfile.open(path).getnames()
              else:
                  continue
              bad = [name for name in names if any(item in name for item in forbidden)]
              if bad:
                  raise SystemExit(f"{path.name}: forbidden archive entries: {bad}")
          PY

      - name: Audit wheel runtime dependencies only
        run: |
          python -m venv runtime
          runtime/bin/python -m pip install --upgrade "pip==26.1.2"
          runtime/bin/python -m pip install dist/breachsafe_qureddy-*.whl
          python -m venv audit-tool
          audit-tool/bin/python -m pip install "pip-audit==2.10.1"
          audit-tool/bin/pip-audit \
            --path runtime/lib/python3.12/site-packages

      - name: Upload exact candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

  packaging-install:
    name: "Package: clean install (${{ matrix.os }})"
    needs: packaging-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-candidate
          path: dist/

      - name: Verify artifact hashes
        run: |
          cd dist
          python - <<'PY'
          from pathlib import Path
          import hashlib

          for line in Path("SHA256SUMS").read_text().splitlines():
              expected, name = line.split(maxsplit=1)
              path = Path(name.lstrip("*"))
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
          PY

      - name: Install wheel, sdist, and pipx application
        run: |
          python -m venv wheel-env
          python -m venv sdist-env
          python -m pip install "pipx==1.8.0"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_python="wheel-env/Scripts/python"
            wheel_qureddy="wheel-env/Scripts/qureddy"
            sdist_python="sdist-env/Scripts/python"
            sdist_qureddy="sdist-env/Scripts/qureddy"
            export PIPX_HOME="$RUNNER_TEMP/pipx-home"
            export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
            pipx_qureddy="$PIPX_BIN_DIR/qureddy.exe"
          else
            wheel_python="wheel-env/bin/python"
            wheel_qureddy="wheel-env/bin/qureddy"
            sdist_python="sdist-env/bin/python"
            sdist_qureddy="sdist-env/bin/qureddy"
            export PIPX_HOME="$RUNNER_TEMP/pipx-home"
            export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
            pipx_qureddy="$PIPX_BIN_DIR/qureddy"
          fi
          "$wheel_python" -m pip install dist/breachsafe_qureddy-*.whl
          "$sdist_python" -m pip install dist/breachsafe_qureddy-*.tar.gz
          "$wheel_python" -m pip check
          "$sdist_python" -m pip check
          python -m pipx install dist/breachsafe_qureddy-*.whl
          "$wheel_qureddy" --version
          "$sdist_qureddy" --version
          "$pipx_qureddy" --version
          "$wheel_qureddy" --help > /dev/null
          "$wheel_qureddy" scan tls --help > /dev/null
          "$wheel_qureddy" scan ssh --help > /dev/null

      - name: Exercise installed network and failure contracts
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            qureddy="wheel-env/Scripts/qureddy"
            python_bin="wheel-env/Scripts/python"
            old_openssl="tests/fixtures/openssl/fake/openssl_too_old.cmd"
          else
            qureddy="wheel-env/bin/qureddy"
            python_bin="wheel-env/bin/python"
            old_openssl="tests/fixtures/openssl/fake/openssl_too_old.sh"
          fi
          "$qureddy" scan ssh github.com --format json > ssh.json
          "$python_bin" -c \
            'import json; assert json.load(open("ssh.json"))["scan"]["scanner_name"] == "ssh"'
          set +e
          "$qureddy" scan tls example.com \
            --openssl "$old_openssl" --format cbom > old-openssl.cbom.json
          exit_code=$?
          set -e
          test "$exit_code" -eq 3
          "$python_bin" -c \
            'import json; assert json.load(open("old-openssl.cbom.json"))["specVersion"] == "1.7"'
