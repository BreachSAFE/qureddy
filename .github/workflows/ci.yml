# SPDX-License-Identifier: Apache-2.0
#
# QuReddy CI — 7-phase pipeline per docs/contributors/coding-rules.md §21.
#
# Matrix: ubuntu × macos × windows on Python 3.12. OpenSSL 3.5+ installed
# per OS. Every test runs every time. pytest-rerunfailures absorbs
# transient hiccups (3 attempts, 1s delay) globally via pyproject.toml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ===========================================================================
  # Phase 1 — Static analysis (no execution).
  # Lint, format-check, type, static security, dep CVEs, license, secrets.
  # ===========================================================================
  phase-1-static:
    name: "Phase 1: Static (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run --locked ruff check .

      - name: ruff format --check
        run: uv run --locked ruff format --check .

      - name: mypy --strict
        run: uv run --locked mypy src/qureddy --strict

      - name: bandit
        run: uv run --locked bandit -r -ll src/qureddy scripts/

      - name: pip-audit
        run: |
          uv run --locked pip-audit \
            --ignore-vuln PYSEC-2026-3481 \
            --ignore-vuln PYSEC-2026-3482 \
            --ignore-vuln PYSEC-2026-3483

      - name: deptry
        run: uv run --locked deptry .

      - name: reuse lint
        run: uv run --locked reuse lint

      - name: gitleaks (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Phase 2 — Unit tests (hermetic, no network, no real OpenSSL).
  # Excludes tests/live/.
  # ===========================================================================
  phase-2-unit:
    name: "Phase 2: Unit (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: phase-1-static
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: pytest (unit only, with coverage)
        run: |
          uv run --locked pytest --ignore=tests/live \
            --cov=qureddy \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=pytest-results.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            .coverage
            coverage.xml
            pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Phase 3 — Integration tests (real OpenSSL 3.5+ subprocess, no network).
  # OpenSSL is installed per-OS.
  # ===========================================================================
  phase-3-integration:
    name: "Phase 3: Integration (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: phase-2-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install OpenSSL 3.5+ (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ubuntu 24.04 ships OpenSSL 3.0; install 3.5+ from upstream tarball.
          OPENSSL_VERSION="3.5.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null
          echo "/opt/openssl-3.5/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl-3.5/lib64:/opt/openssl-3.5/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install OpenSSL 3.5+ (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL 3.5+ (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Chocolatey's versioned package delegates to an upstream installer
          # URL that disappears when Shining Light rotates releases. Install
          # the maintained current package, then verify the capability below.
          choco install openssl --no-progress -y
          $candidates = @(
            (Join-Path $env:ProgramFiles "OpenSSL\bin\openssl.exe"),
            (Join-Path $env:ProgramFiles "OpenSSL-Win64\bin\openssl.exe"),
            (Join-Path $env:ChocolateyInstall "bin\openssl.exe")
          )
          $opensslExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslExe) {
            throw "Chocolatey installed OpenSSL but no openssl.exe was discoverable"
          }
          $opensslBin = Split-Path -Parent $opensslExe
          $opensslBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify OpenSSL version
        run: |
          openssl version
          openssl list -tls1_3 -tls-groups | tee openssl-groups.txt
          grep -qi X25519MLKEM768 openssl-groups.txt

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: pytest tests/test_openssl_probe.py
        run: uv run --locked pytest tests/test_openssl_probe.py -v

  # ===========================================================================
  # Phase 4 — Live tests (network required, real targets).
  # tests/live/ runs with default pytest. pytest-rerunfailures absorbs hiccups.
  # ===========================================================================
  phase-4-live:
    name: "Phase 4: Live (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: phase-3-integration
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install OpenSSL 3.5+ (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          OPENSSL_VERSION="3.5.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null
          echo "/opt/openssl-3.5/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl-3.5/lib64:/opt/openssl-3.5/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install OpenSSL 3.5+ (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL 3.5+ (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install openssl --no-progress -y
          $candidates = @(
            (Join-Path $env:ProgramFiles "OpenSSL\bin\openssl.exe"),
            (Join-Path $env:ProgramFiles "OpenSSL-Win64\bin\openssl.exe"),
            (Join-Path $env:ChocolateyInstall "bin\openssl.exe")
          )
          $opensslExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslExe) {
            throw "Chocolatey installed OpenSSL but no openssl.exe was discoverable"
          }
          $opensslBin = Split-Path -Parent $opensslExe
          $opensslBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install project (dev extras)
        run: uv sync --locked --extra dev

      - name: Verify OpenSSL capability
        run: |
          openssl version
          openssl list -tls1_3 -tls-groups | tee openssl-groups.txt
          grep -qi X25519MLKEM768 openssl-groups.txt

      - name: pytest tests/live/
        run: uv run --locked pytest tests/live/ -v --junitxml=live-results.xml

      - name: Upload live-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-results-${{ matrix.os }}
          path: live-results.xml
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Phase 5 — Self-scan (qureddy scans qureddy's canonical targets).
  # ===========================================================================
  phase-5-self-scan:
    name: "Phase 5: Self-scan"
    runs-on: ubuntu-latest
    needs: phase-4-live

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install OpenSSL 3.5+
        run: |
          OPENSSL_VERSION="3.5.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl -LO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 shared
          make -j"$(nproc)" > /dev/null
          sudo make install_sw > /dev/null
          echo "/opt/openssl-3.5/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/openssl-3.5/lib64:/opt/openssl-3.5/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Scan canonical targets
        run: |
          mkdir -p phase-5-self-scan
          uv run --locked qureddy scan tls www.cloudflare.com --format json > phase-5-self-scan/cloudflare.json
          uv run --locked qureddy scan tls pq.cloudflareresearch.com --format json > phase-5-self-scan/pq-cloudflare.json
          uv run --locked qureddy scan tls www.google.com --format json > phase-5-self-scan/google.json
          uv run --locked qureddy scan tls example.com --format json > phase-5-self-scan/example.json
          uv run --locked qureddy scan tls 1.1.1.1:443 --sni one.one.one.one --format json > phase-5-self-scan/1111.json
          set +e
          uv run --locked qureddy scan tls tls-v1-2.badssl.com:1012 --format json > phase-5-self-scan/tls12.json
          tls12_exit=$?
          set -e
          test "$tls12_exit" -eq 2

      - name: Upload self-scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-self-scan
          path: phase-5-self-scan/
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # Phase 6 — Build verification.
  # ===========================================================================
  phase-6-build:
    name: "Phase 6: Build"
    runs-on: ubuntu-latest
    needs: phase-5-self-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: uv build
        run: |
          uv sync --locked --extra dev
          uv build

      - name: Upload built artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: trivy fs scan
        # v0.36.0, pinned to the dereferenced commit (not a mutable tag).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          skip-dirs: scratch,.git

  # ===========================================================================
  # Phase 7 — Audit. Reads prior phase artifacts. Asserts on counts.
  # The anti-skim guard: passing exit codes from earlier phases are NOT enough.
  # ===========================================================================
  phase-7-audit:
    name: "Phase 7: Audit"
    runs-on: ubuntu-latest
    needs: phase-6-build
    if: always()  # always run even if prior phases failed; audit reports the gaps

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install locked audit dependencies
        run: uv sync --locked --extra dev

      - name: Download all phase artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts/

      - name: List artifacts
        run: ls -laR ci-artifacts/ || echo "no artifacts collected"

      - name: Run audit script
        run: uv run --locked python scripts/audit_phase.py --artifacts-dir ci-artifacts/
