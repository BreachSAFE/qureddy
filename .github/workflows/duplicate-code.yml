# SPDX-License-Identifier: Apache-2.0
#
# Duplicate-code gate (#314) — fails a PR when duplication in src/ grows, so the code
# de-duplication milestone (#315) does not silently regress. Two complementary detectors:
#   - jscpd (token-level): literal/near-literal copy-paste. Config in .jscpd.json.
#   - pylint duplicate-code / R0801 (AST-level): structural clones jscpd misses (renamed
#     vars still match). Config in pyproject.toml [tool.pylint].
# Semantic duplication (same logic, different shape) that neither catches stays the
# reviewer's + breachsafe-implement skill's job.

name: duplicate-code

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".jscpd.json"
      - "pyproject.toml"
      - ".github/workflows/duplicate-code.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duplicate-code-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Token-level clones (jscpd)
        run: npx --yes jscpd@4 src/ --config .jscpd.json --reporters consoleFull,html

      - name: Structural clones (pylint duplicate-code / R0801)
        run: pipx run --spec 'pylint==4.0.7' pylint src/qureddy/

      - name: Upload jscpd HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jscpd-report
          path: report/
          if-no-files-found: ignore
          retention-days: 30
