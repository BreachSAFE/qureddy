# SPDX-License-Identifier: Apache-2.0
#
# ClusterFuzzLite short fuzz run on pull requests (issue #86).
#
# Builds the Atheris harnesses under tests/fuzz/ in the OSS-Fuzz Python base
# image (see .clusterfuzzlite/) and fuzzes only the parsers touched by the PR
# for a short, bounded time. This is the self-hosted, no-acceptance-process
# alternative to Google OSS-Fuzz and provides the Scorecard "Fuzzing" signal.
#
# Reference: https://google.github.io/clusterfuzzlite/

name: CIFuzz

on:
  pull_request:
    # Only run when parser code, the harnesses, or the fuzzing setup change.
    paths:
      - "src/qureddy/**"
      - "tests/fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cifuzz.yml"

# Deny all scopes by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: cifuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: ClusterFuzzLite PR fuzzing
    runs-on: ubuntu-latest
    permissions:
      contents: read # build_fuzzers checks out the PR head
    steps:
      - name: Build fuzzers
        id: build
        # Pinned to a full commit SHA (ClusterFuzzLite publishes no tags).
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          language: python
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Short, bounded run so the PR gate stays fast.
          fuzz-seconds: 120
          mode: "code-change"
          sanitizer: "address"
          output-sarif: false
