# SPDX-License-Identifier: Apache-2.0
#
# GitHub-native CodeQL static analysis.
#
# CodeQL is GitHub's SAST. Free for public repos. Catches taint flows,
# dataflow issues, and language-specific security smells that ruff/bandit
# do not. Required for OpenSSF Best Practices passing tier per CODING_RULES §29.
#
# Reference: https://github.com/github/codeql-action

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 08:00 UTC. Weekly scheduled scan even without PR activity.
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended queries pack for stricter coverage.
          queries: +security-extended

      - name: Set up Python 3.12
        if: matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install project from lock
        if: matrix.language == 'python'
        run: uv sync --locked --extra dev

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:${{ matrix.language }}"
