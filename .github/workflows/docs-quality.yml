name: Documentation quality

on:
  pull_request:
    paths:
      - "*.md"
      - "docs/**"
      - "tests/fixtures/**/*.md"
      - "scripts/check_docs.py"
      - ".markdownlint-cli2.jsonc"
      - ".lycheeignore"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - "tests/fixtures/**/*.md"
      - "scripts/check_docs.py"
      - ".markdownlint-cli2.jsonc"
      - ".lycheeignore"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Documentation structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate numbered contents and local anchors
        run: python scripts/check_docs.py

  markdown:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@28a7e8bdb81fd8ad675883de92c758ab78e0ce10 # v24

  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}" --accept 200,206,429
            --verbose --no-progress
            "*.md" "docs/**/*.md" "tests/fixtures/**/*.md"
          fail: true
          jobSummary: true
