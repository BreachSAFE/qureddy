# SPDX-License-Identifier: Apache-2.0
#
# OpenSSF Scorecard weekly assessment.
#
# Scorecard scans the repo for OSS supply-chain best practices and
# publishes a score. We target the OpenSSF Best Practices Badge:
# OpenSSF Scorecard evidence is collected on every main-branch change.
#
# Reference: https://github.com/ossf/scorecard-action

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Mondays 06:00 UTC. Weekly cadence; not on every PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all


concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # for SARIF upload
      id-token: write         # for publish_results
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish results to https://api.securityscorecards.dev so the
          # README badge stays current. Requires repo to be public.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 90

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard-results.sarif
