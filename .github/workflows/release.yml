# SPDX-License-Identifier: Apache-2.0
# Publish the built wheel + sdist to TestPyPI (and, when ready, PyPI) via OIDC Trusted
# Publishing — NO API tokens in the repo. Register a matching TestPyPI "pending publisher":
#   owner=breachsafe  repo=qureddy  workflow=release.yml  environment=testpypi
#
# "TestPyPI gets the latest": every GitHub Release (and manual dispatch) rebuilds and uploads.
# `skip-existing` keeps a re-run from failing when a version is already present — bump the
# version (pyproject) to publish a genuinely new one.
name: release

on:
  release:
    types: [published]     # cut a GitHub Release → auto-publish
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build distributions
        run: |
          uv tool run --from "build==1.3.0" python -m build  # → dist/*.whl + dist/*.tar.gz
      - name: Check with twine
        run: |
          uv tool run --from "twine==6.2.0" twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi     # must match the TestPyPI pending-publisher "Environment name"
    permissions:
      id-token: write         # OIDC — this is what enables tokenless publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true      # don't fail if this version is already on TestPyPI

  # Enable once a real-PyPI Trusted Publisher (environment: pypi) is registered:
  # pypi:
  #   name: publish to PyPI (OIDC)
  #   needs: testpypi
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
  #       with:
  #         name: dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release-v1
