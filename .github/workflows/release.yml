# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# Publish the built wheel + sdist to TestPyPI (and, when ready, PyPI) via OIDC Trusted
# Publishing — NO API tokens in the repo. Register a matching TestPyPI "pending publisher":
#   owner=breachsafe  repo=qureddy  workflow=release.yml  environment=testpypi
#
# "TestPyPI gets the latest": every GitHub Release (and manual dispatch) rebuilds and uploads.
# `skip-existing` keeps a re-run from failing when a version is already present — bump the
# version (pyproject) to publish a genuinely new one.
name: release

on:
  release:
    types: [published]     # cut a GitHub Release → auto-publish
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: read


concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload signed artifacts as GitHub Release assets (#121)
      id-token: write        # OIDC for the SLSA provenance attestation + cosign keyless
      attestations: write    # write the attestation to the repo's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build distributions
        run: |
          uv tool run --from "build==1.3.0" python -m build  # → dist/*.whl + dist/*.tar.gz
      - name: Check with twine
        run: |
          uv tool run --from "twine==6.2.0" twine check dist/*
      # SLSA build provenance for the wheel + sdist (#85). Verifiable with
      # `gh attestation verify <file> --repo breachsafe/qureddy`. The TestPyPI/PyPI
      # publish also emits PEP 740 attestations via OIDC (id-token in that job).
      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      # Hand the pristine dist/ to the TestPyPI job before any signature bundles land in
      # dist/, so twine never tries to publish a .sigstore file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      # Signed-Releases (#121): cosign keyless OIDC signature bundles attached to the
      # GitHub Release so OpenSSF Scorecard can discover a signature next to each asset.
      # Only meaningful on `release: published` (workflow_dispatch has no release tag).
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign distributions with cosign (keyless OIDC)
        if: github.event_name == 'release'
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore" "$f"
          done
      - name: Upload signed distributions to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  testpypi:
    name: publish to TestPyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi     # must match the TestPyPI pending-publisher "Environment name"
    permissions:
      id-token: write         # OIDC — this is what enables tokenless publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true      # don't fail if this version is already on TestPyPI

  # Enable once a real-PyPI Trusted Publisher (environment: pypi) is registered:
  # pypi:
  #   name: publish to PyPI (OIDC)
  #   needs: testpypi
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
  #       with:
  #         name: dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release-v1
