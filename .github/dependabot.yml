# SPDX-License-Identifier: Apache-2.0
#
# Dependabot configuration. Automated dependency update PRs.
#
# Required for OpenSSF Best Practices passing tier per CODING_RULES §29.
# Dependabot opens one PR per outdated dependency or grouped batch; CI
# runs the Tier 1 gates on each PR before merge.
#
# Reference: https://docs.github.com/en/code-security/dependabot

version: 2

updates:

  # Digest-pinned container bases need a regular update proposal so security
  # fixes do not age out silently. Each PR runs the container smoke gate.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      # Both OpenSSL stages share one repository path, so Dependabot cannot
      # tell the current-strength lane (3.5.8) from the compatibility lane
      # (1.0.2u). Constrain by version instead of by name, which keeps the
      # 3.5.x digest refresh flowing and refuses anything past the platform
      # pin (CLAUDE.md §7: OpenSSL >=3.5.8 <3.6).
      #
      # PR #1036 proposed 1.0.2u -> 4.0.2 on the legacy stage. A 4.x build
      # omits SSLv3 and the weak suites that stage exists to offer, so the
      # bump would silently delete the compatibility probe lane (§12).
      - dependency-name: "paul007ex/breachsafe-openssl"
        versions: [">= 3.6"]

  # ---------------------------------------------------------------------------
  # Python runtime + dev dependencies (pyproject.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # Group dev tools together so weekly updates land as one PR.
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
          - "pip-audit"
          - "deptry"
          - "reuse"
        update-types:
          - "minor"
          - "patch"
      # Group test tools.
      test-tools:
        patterns:
          - "pytest"
          - "pytest-*"
        update-types:
          - "minor"
          - "patch"
    # Major version bumps always get their own PR for human review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Intentional upper-bound pins in pyproject.toml; stop Dependabot from
      # re-proposing bumps past them.
      # ruff pinned <0.16 (0.16 starts markdown-format-checking private skill
      # files); do not accept the minor bump past the pin (PR #188).
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typer pinned <0.27 (exit-code contract); do not accept the minor bump
      # past the pin (PR #197).
      - dependency-name: "typer"
        update-types: ["version-update:semver-minor"]

  # ---------------------------------------------------------------------------
  # GitHub Actions used in .github/workflows/
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      gha-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
