[extend]
useDefault = true

# This is an inert OpenSSL parser fixture, not a credential. The default
# generic-api-key rule reads "group:" as a credential assignment and extracts
# the standardized TLS hybrid-group identifier as its candidate secret.
#
# Keep all four predicates: this exception applies only to the rule, historical
# introducing commit, documentation path, and exact fixture line audited here.
[[allowlists]]
description = "OpenSSL X25519MLKEM768 parser fixture in an archived prompt"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["72f3fa4d750a393460ac40348e71f4b6c717bbce"]
paths = ['''^docs/mvp/MVP-0\.1-[Cc][Ll][Aa][Uu][Dd][Ee]-PROMPT\.md$''']
regexTarget = "line"
regexes = ['''^\s*-\s*`Server Temp Key: X25519MLKEM768`\s*$''']

# This is the published SEC1 generator-point test vector used to prove CBOM
# public-key material is emitted. It is public test data, not a credential.
[[allowlists]]
description = "Published SEC1 public-key test vector"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["b82bd6cc34f48208d7ee551c76df77a238d0a7c3"]
paths = ['''^tests/test_cbom_wallet\.py$''']
regexTarget = "line"
regexes = ['''^\s*_KEY\s*=\s*"0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"\s*$''']

# This documentation fixture names the OpenSSL TLS transcript field; it is not
# a secret and is intentionally asserted by the release-gate documentation.
[[allowlists]]
description = "OpenSSL transcript field documentation fixture"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["16623fa5ac76f032f9ac2cb7ad93576bd422ae29"]
paths = ['''^(docs/contributors/local-release-gate\.md|tests/test_release_gate\.py)$''']
regexTarget = "line"
regexes = ['''Server Temp Key: X25519MLKEM768''']

# The same reviewed fixture was wrapped across two Markdown lines in the
# historical documentation commit, so match the whole finding rather than one line.
[[allowlists]]
description = "Wrapped OpenSSL transcript field documentation fixture"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["16623fa5ac76f032f9ac2cb7ad93576bd422ae29"]
paths = ['''^docs/contributors/local-release-gate\.md$''']
regexTarget = "match"
regexes = ['''Server Temp Key:\s*X25519MLKEM768''']

# Gitleaks' normalized match starts at the assignment value for this wrapped
# historical line; constrain the exception to that exact public identifier.
[[allowlists]]
description = "Wrapped OpenSSL transcript identifier"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["16623fa5ac76f032f9ac2cb7ad93576bd422ae29"]
paths = ['''^docs/contributors/local-release-gate\.md$''']
regexTarget = "secret"
regexes = ['''^X25519MLKEM768$''']
